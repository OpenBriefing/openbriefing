name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/openbriefing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/openbriefing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fixtures are up to date
        run: |
          npm run fixtures
          npm run expected
          git diff --exit-code -- ../../spec/fixtures
